    <script>
      (function () {
        try {
          var target = typeof window !== 'undefined' ? window : globalThis;
          var origFetch = target.fetch ? target.fetch.bind(target) : undefined;
          var curFetch = origFetch;
          Object.defineProperty(target, 'fetch', {
            get: function () {
              return curFetch || origFetch;
            },
            set: function (fn) {
              curFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
